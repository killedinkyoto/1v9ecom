<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Active — Mindor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111309; --execution-green: #E2FF47;
      --text-primary: #F0F0E8; --fog-grey: #C8C9B8; --surface: #161A0E;
    }
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=DM+Sans:wght@400;600&display=swap');
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card { max-width: 440px; width: 100%; text-align: center; }
    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--execution-green);
      margin-bottom: 36px;
    }
    .check {
      width: 60px; height: 60px;
      background: rgba(226,255,71,0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 30px;
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }
    .sub-line {
      font-size: 15px;
      color: var(--execution-green);
      font-weight: 600;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: var(--fog-grey);
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .detail-box {
      background: var(--surface);
      border: 1px solid rgba(226,255,71,0.14);
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 0;
      text-align: left;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 0.5px solid rgba(255,255,255,0.06);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--fog-grey); }
    .detail-value { color: var(--text-primary); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MM MINDOR</div>
    <div class="check">✓</div>
    <h1>You're Subscribed.</h1>
    <p class="sub-line">First tub ships within 24–48 hours.</p>
    <p>Your monthly auto-ship is confirmed at $31.44/mo. We'll charge your card and ship a fresh tub every 30 days. Cancel anytime.</p>
    <div class="detail-box">
      <div class="detail-row">
        <span class="detail-label">Plan</span>
        <span class="detail-value">Monthly Auto-Ship</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Price</span>
        <span class="detail-value">$31.44/mo per tub</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Next charge</span>
        <span class="detail-value" id="detailNext">In 30 days</span>
      </div>
    </div>
  </div>
  <!-- Meta Pixel -->
  <script>!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','1460636158529685');fbq('track','PageView');</script>
  <script>
    var next = new Date();
    next.setDate(next.getDate() + 30);
    var el = document.getElementById('detailNext');
    if (el) el.textContent = next.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

    // If addons/gifts were selected, redirect to Shopify after a short delay
    // Fire Purchase event for Meta Pixel
    var params = new URLSearchParams(window.location.search);
    (function() {
      var BASE = 32.99, BUNDLE_DISC = {1:0, 2:0.10, 3:0.15}, SUB_DISC = 0.15;
      var qty = parseInt(params.get('qty')) || 1;
      var value = +(BASE * qty * (1 - (BUNDLE_DISC[qty]||0)) * (1 - SUB_DISC)).toFixed(2);
      try { fbq('track','Purchase',{value:value,currency:'USD',content_ids:['mindor-stack'],content_type:'product',num_items:qty}); } catch(e) {}
    })();
    var checkoutUrl = params.get('checkout');
    if (checkoutUrl) {
      var decoded = decodeURIComponent(checkoutUrl);
      // Show a small note
      var note = document.createElement('p');
      note.style.cssText = 'margin-top:24px;font-size:13px;color:#6A7A5A;';
      note.textContent = 'Completing your add-ons in 3 seconds…';
      document.querySelector('.card').appendChild(note);
      var count = 3;
      var iv = setInterval(function() {
        count--;
        note.textContent = 'Completing your add-ons in ' + count + ' second' + (count !== 1 ? 's' : '') + '…';
        if (count <= 0) { clearInterval(iv); window.location.href = decoded; }
      }, 1000);
    }
  </script>
</body>
</html>
