<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mindor Performance Stack — 5 clinically dosed compounds for remote cognitive workers. Calm alertness, no crash.">
  <title>Mindor — 5 Compounds. One Clean Cognitive Window.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ── TOKENS ── */
    :root {
      --accent-purple: #9B7FE0;
      --purple-light: #EDE8F8;
      --deep-work-black: #1A2040;
      --sprint-blue: #4A6BD4;
      --fog-grey: #3D5070;
      --bg: #ECF2FB;
      --surface: #E0E9F7;
      --surface2: #D4DEF2;
      --border: rgba(74,107,212,0.14);
      --border-subtle: rgba(74,107,212,0.08);
      --border-accent: rgba(74,107,212,0.30);
      --text-primary: #1A2040;
      --text-muted: #4A587A;
      --text-dim: #8A9CC0;
      --shadow-sm: 0 2px 8px rgba(74,107,212,0.10), 0 1px 3px rgba(74,107,212,0.06);
      --shadow-md: 0 8px 32px rgba(74,107,212,0.14), 0 2px 8px rgba(74,107,212,0.08);
      --shadow-lg: 0 20px 60px rgba(74,107,212,0.18), 0 4px 16px rgba(74,107,212,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
      overflow-x: hidden;
    }

    /* ── SHARED LAYOUT ── */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .container--narrow {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── SHARED TYPOGRAPHY ── */
    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: block;
      margin-bottom: 16px;
    }

    .eyebrow--blue { color: var(--sprint-blue); }

    .section-headline {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 5vw, 52px);
      color: var(--text-primary);
      line-height: 0.95;
      letter-spacing: -0.01em;
    }

    .section-subhead {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(18px, 2.5vw, 24px);
      color: var(--fog-grey);
      line-height: 1.1;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .body-copy {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* ── SHARED COMPONENTS ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(74,107,212,0.10);
      border: 0.5px solid rgba(74,107,212,0.25);
      border-radius: 100px;
      padding: 4px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--sprint-blue);
      text-transform: uppercase;
    }

    .badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--sprint-blue);
      flex-shrink: 0;
    }

    .btn-primary {
      display: inline-block;
      background: var(--sprint-blue);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 16px 40px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.15s;
      box-shadow: var(--shadow-md);
      width: 100%;
      text-align: center;
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); opacity: 1; }

    /* ── DIVIDER ── */
    .section-divider {
      width: 32px;
      height: 2px;
      background: var(--sprint-blue);
      border-radius: 1px;
      margin-bottom: 20px;
    }

    /* ── SECTION SPACING ── */
    .section { padding: 80px 0; }
    .section--sm { padding: 56px 0; }
    .section--dark {
      background: var(--deep-work-black);
      padding: 80px 0;
    }
  </style>
</head>
<body>

  <!-- sections go here -->

  <script>
    // JS goes here in Task 13
  </script>
</body>
</html>
